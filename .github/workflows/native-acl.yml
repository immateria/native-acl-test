name: native-acl
run-name: "ACL · ${{ inputs.lane || 'all' }} · ${{ inputs.profile || 'smoke' }} · ${{ github.ref_name }}"

on:
  push:
    branches: ['**']
    paths:
      - 'acl/**'
      - 'lab/**'
      - 'probes/**'
      - 'ci/**'
      - 'scripts/**'
      - 'tests/**'
      - 'run*'
      - '.github/workflows/native-acl.yml'
  workflow_dispatch:
    inputs:
      lane:
        description: 'all = macOS + two Windows tokens; windows-lab = disposable local accounts only'
        type: choice
        options: [all, macos-arm64, windows-elevated, windows-filtered, windows-lab]
        default: all
      profile:
        description: 'Case catalog (windows-lab always selects its full multiuser catalog)'
        type: choice
        options: [smoke, full, stress]
        default: full
      only:
        description: 'Optional case ID/glob. Pick one matching lane; use full for non-smoke IDs.'
        type: string
        required: false
      seed:
        description: 'Reproducible seed, 0–2147483646'
        type: string
        default: '20261103'

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - run: python3 -m ci.catalog_lock
      - run: python3 -m unittest discover -s tests -v
      - id: plan
        env:
          ACL_CHOICE: ${{ inputs.lane || 'all' }}
        shell: bash
        run: |
          set -eu
          matrix=$(python3 -m ci.lane matrix)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  native:
    needs: plan
    name: ${{ matrix.lane }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      ACL_LANE: ${{ matrix.lane }}
      ACL_PROFILE: ${{ inputs.profile || 'smoke' }}
      ACL_ONLY: ${{ inputs.only || '' }}
      ACL_SEED: ${{ inputs.seed || '20261103' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Start an evidence directory before installing tools
        shell: bash
        run: |
          mkdir ci-out
          printf 'run=%s attempt=%s sha=%s lane=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$ACL_LANE" >ci-out/bootstrap.txt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12'}
      - id: init
        name: Record planned cases and runner provenance
        run: python -m ci.lane init
      - name: Fetch the same Windows bootstrap and filtered-token launcher used by native-test
        if: runner.os == 'Windows'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: immateria/native-test
          ref: 7ad681568e1ef18ce9f429d6a4962496ddd64d11
          persist-credentials: false
          path: .ci-reference
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/setup-crystal-windows/
            /explore/windows/job_explore.cr
      - name: Set up pinned Crystal and MSVC
        if: runner.os == 'Windows'
        uses: ./.ci-reference/.github/actions/setup-crystal-windows
      - name: Install pinned universal Crystal
        if: runner.os == 'macOS'
        shell: bash
        run: bash ci/install-macos.sh
      - name: Verify platform toolchain and prepare token launcher
        id: setup
        shell: pwsh
        if: runner.os == 'Windows'
        run: ./ci/prepare-windows.ps1
      - name: Verify macOS compiler and SDK
        id: macsetup
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          crystal --version
          xcrun --find clang
          xcrun --show-sdk-version
          sw_vers
      # Both phases are attempted after a toolchain/identity launcher is ready.
      - name: Standalone native observations (mac)
        id: mac_explore
        timeout-minutes: 10
        if: always() && steps.macsetup.outcome == 'success'
        shell: bash
        run: python -u -m ci.lane explore
      - name: Standalone native observations (win)
        id: win_explore
        timeout-minutes: 10
        if: always() && steps.setup.outcome == 'success'
        shell: pwsh
        run: ./ci/windows-step.ps1 -Stage explore
      - name: Qualify the shard against the native oracle (mac)
        id: mac_collect
        timeout-minutes: 120
        if: always() && steps.macsetup.outcome == 'success'
        shell: bash
        run: python -u -m ci.lane collect
      - name: Qualify the shard against the native oracle (win)
        id: win_collect
        timeout-minutes: 120
        if: always() && steps.setup.outcome == 'success'
        shell: pwsh
        run: ./ci/windows-step.ps1 -Stage collect
      - name: Validate, summarize and salvage completed evidence
        if: always()
        env:
          ACL_SETUP_OUTCOME: ${{ runner.os == 'Windows' && steps.setup.outcome || steps.macsetup.outcome }}
          ACL_COLLECT_OUTCOME: ${{ runner.os == 'Windows' && steps.win_collect.outcome || steps.mac_collect.outcome }}
          ACL_EXPLORE_OUTCOME: ${{ runner.os == 'Windows' && steps.win_explore.outcome || steps.mac_explore.outcome }}
        run: python -m ci.lane finish
      - name: Upload handback even from red jobs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acl-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
